name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22.12.0
          - 24.x
          - 26.x

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Use exact npm
        run: npm install --global npm@10.9.0

      - name: Install exact dependencies
        run: npm ci

      - name: Validate
        run: npm run validate

  loader-portability:
    name: Loader portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Use exact npm
        run: npm install --global npm@10.9.0

      - name: Install exact dependencies
        run: npm ci

      - name: Build schema
        run: npm --prefix schemas run build

      - name: Build content compiler
        run: npm --prefix packages/content run build

      - name: Build reader projector
        run: npm --prefix packages/reader run build

      - name: Build Publisher application
        run: npm --prefix packages/publisher run build

      - name: Verify source loader portability
        run: npm exec -- node --test --test-concurrency=1 tests/path-portability.test.mjs tests/publisher-source-loader.test.mjs tests/publisher-package-consumer.test.mjs tests/publisher-loader-compiler.test.mjs

      # The archive reader refuses Windows-reserved member paths and falls back
      # when O_NOFOLLOW and O_NONBLOCK are unavailable, so its rejections are
      # only proven by running it on every supported operating system.
      - name: Verify package archive reader portability
        run: npm exec -- node --test --test-concurrency=1 provenance/scripts/archive-reader.test.mjs

  browser-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Use exact npm
        run: npm install --global npm@10.9.0

      - name: Install exact dependencies
        run: npm ci

      - name: Build packages
        run: npm run build

      - name: Locate preinstalled Chrome
        shell: bash
        run: |
          browser_executable="$(command -v google-chrome)"
          test -x "$browser_executable"
          printf 'PUBLISHER_NEXT_BROWSER_EXECUTABLE=%s\n' "$browser_executable" >> "$GITHUB_ENV"

      - name: Verify hydrated error attribution
        run: npm exec -- node --test --test-concurrency=1 tests/next-packaged-host.test.mjs
