name: Publish

on:
  workflow_dispatch:
    inputs:
      npm_tag:
        description: Exact npm distribution tag
        required: true
        type: choice
        options:
          - next
          - latest

permissions:
  contents: read
  id-token: write

concurrency:
  group: publisher-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    environment: npm-publish
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Require an exact version tag
        shell: bash
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          case "$GITHUB_REF_NAME" in
            v[0-9]*) ;;
            *) exit 1 ;;
          esac

      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use preparation Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm

      - name: Use exact preparation npm
        run: npm install --global npm@10.9.0

      - name: Install exact dependencies
        run: npm ci

      - name: Validate tagged source
        run: npm run validate

      - name: Prepare exact package archives
        shell: bash
        env:
          NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/publisher-release
        run: |
          mkdir "$RELEASE_DIRECTORY"
          npm run release:prepare -- --output "$RELEASE_DIRECTORY" --tag "$NPM_TAG"

      - name: Reverify exact package archives
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/publisher-release/release-manifest.json
        run: npm run release:verify -- --manifest "$RELEASE_MANIFEST"

      - name: Verify deployed attribution and schemas
        run: npm run release:verify-public-surface

      - name: Retain exact release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publisher-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/publisher-release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

      - name: Use trusted publishing Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x

      - name: Use trusted publishing npm
        run: npm install --global npm@11.5.1

      - name: Configure token-free npm registry access
        shell: bash
        run: |
          npm_configuration="$RUNNER_TEMP/publisher-trusted.npmrc"
          printf 'registry=https://registry.npmjs.org/\nprovenance=true\n' > "$npm_configuration"
          chmod 600 "$npm_configuration"
          printf 'NPM_CONFIG_USERCONFIG=%s\n' "$npm_configuration" >> "$GITHUB_ENV"

      - name: Publish exact retained archives with OIDC
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/publisher-release/release-manifest.json
        run: npm run release:publish -- --manifest "$RELEASE_MANIFEST"
